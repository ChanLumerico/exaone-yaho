# §7.3 / §7.4 — Stage-1 SFT config for `mlx_lm.lora --train -c configs/sft.yaml`.
# Keys below mirror mlx-lm's LoRA config schema; project rationale in comments.
# Confirmed base: EXAONE-3.5-2.4B, bf16 (full precision) MLX, plain LoRA (§7.1).

# Path to the bf16 MLX-converted base (produced by `mlx_lm.convert`, no -q).
model: "models/EXAONE-3.5-7.8B-Instruct-bf16"   # v4 — upgraded base (7.8B) for technical accuracy
train: true
fine_tune_type: lora              # §7.3 — lora (default); dora/full also possible
optimizer: adamw
data: "data/mlx"                  # dir with train.jsonl / valid.jsonl (/ test.jsonl), §7.2
seed: 42                          # reproducibility (§11, §17.3)

# --- capacity vs. forgetting (§7.4 b/f) ------------------------------------- #
num_layers: -1                    # -1 = apply LoRA to all transformer layers (thin, low-rank)
lora_parameters:
  rank: 16                        # §7.3 r=16 (§7.4: 8–16; style is a low-rank delta)
  scale: 16.0                     # mlx scale = LoRA 델타 직접 배수(기본20); 16=스타일에 적당(§7.4d 강도 다이얼)
  dropout: 0.05
learning_rate: 5.0e-5             # §7.4f — conservative, 1e-4~2e-4, suppress forgetting
lr_schedule:                      # v2 — 발산 방지: warmup + cosine decay
  name: cosine_decay
  warmup: 40
  warmup_init: 1.0e-7
  arguments: [5.0e-5, 2618, 1.0e-6]   # v4 — decay length = iters
max_seq_length: 3072              # v6 — 800tok 답변으로 길어짐(MAX 2595); 17 examples>2048 -> nan 가드
batch_size: 1                     # v4 — 7.8B bf16 on 36GB: batch 1 for memory safety
# iters ≈ epochs(2~4) * n_train / batch_size — recompute when corpus size known (§7.4f)
iters: 2618                       # v4 — 2 epochs over 1309 prefix-expanded train examples (batch 1)
grad_checkpoint: true             # memory safety on Apple Silicon

# §7.2 — chat format ({"messages":[...]}); mask non-assistant turns so only the
# gyaru assistant responses contribute to the loss (assistant-turn masking).
mask_prompt: true

# --- reporting / eval / checkpoints (logged to JSONL via §17) --------------- #
steps_per_report: 10
steps_per_eval: 25             # v3 — align with save_every so val-min checkpoint is saved
val_batches: 8
save_every: 25                 # v3 — == steps_per_eval (capture the val-minimum)
adapter_path: "adapters/sft"
resume_adapter_file: null
test: false
test_batches: 100

# --- project-level (read by data_build.py / train_sft.py, NOT by mlx) ------- #
# Documented here as the SSOT; the build/train wrappers read these keys.
project:
  capability_replay_ratio: 0.15   # §7.4b — 10~20% neutral instruction data mixed in
  early_stop_metric: "J"          # §7.4f — J = Acc_style * Sim, guards over/under-styling
  system_prompt: "너는 갸루 말투로 대답하는 AI야."   # §7.4a — fixed style anchor (train==infer)
