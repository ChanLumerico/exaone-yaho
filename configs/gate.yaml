# §5.3 / §5.4 / §5.5 — Yaho & ParaPara dense gating + arbitration.
# Convex gate (gamma > 1): suppress weak signal, fire hard on strong signal.
#   p = p_base + (p_max - p_base) * s ** gamma

yaho:                 # §5.3 — negativity deflection ("{noun} 야호~")
  # v3 — raised firing: the gate ONLY shapes the OFFLINE corpus (§5.6, no gate at
  # inference), so denser yaho tags => the model actually learns to emit them.
  p_base: 0.02
  p_max: 0.80
  gamma: 1.5
  # NegativityScorer backend (drop-in, §5.3). Dense is the goal; lexicon is the
  # CI/Phase-1b fallback. 'koelectra' = Copycats/koelectra sentiment;
  # 'sent5' = rkdaldus 5-emotion {anger+fear+sadness} sum.
  scorer: lexicon     # lexicon | koelectra | sent5

parapara:             # §5.4 — departure/idle deflection ("...파라파라나 추고있어야겠다~")
  # v3 — raised firing (offline-corpus only); greeting guard keeps neutral ≈0.
  p_base: 0.0
  p_max: 0.88
  gamma: 1.3
  # DepartureScorer backend (drop-in, §5.4). Dense = zero-shot NLI entailment of
  # "the speaker is ending the conversation / leaving".
  scorer: lexicon     # lexicon | nli

arbitration:          # §5.5 — when a turn is both negative AND departing
  departure_priority_threshold: 0.5   # strong departure signal -> parapara wins
  forbid_simultaneous: true           # never emit yaho + parapara in one response
  fallback: plain_gyaru               # both below threshold -> ordinary gyaru decoration

noun_extractor:       # §5.3 / §16.6 — saliency heuristic for the yaho noun
  priority: [proper_noun, object_common_noun, frequency]
  exclude_time_nouns: [오늘, 내일, 어제]
  skip_if_none: true                  # no usable noun -> skip firing (avoid awkward output)

activity_extractor:   # §5.4 / §16.6 — activity phrase for parapara
  patterns: ["~하러 가", "~으러 가", "~러 가"]
  fallback_generic: true              # no activity -> generic template (no {activity})
