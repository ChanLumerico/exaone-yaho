# §10 / §14 — Deployment (HF Hub + serving + Spaces). Non-commercial only (§14).

hf:
  # §14 — derivative model name MUST start with "EXAONE"; license copy bundled.
  model_repo: "ChanLumerico/EXAONE-3.5-2.4B-Instruct-Yaho"
  base_model: "LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct"
  private: false
  license: "exaone"            # EXAONE AI Model License — research/non-commercial
  bundle_license_copy: true    # §14 — ship the EXAONE license in repo + HF
  tags: [korean, gyaru, style-transfer, alignment, mlx, exaone, non-commercial]

serving:
  # §5.6 (LOCKED): the handler does STANDARD generate() ONLY. No scorer, no
  # morphological analyzer, no gating logic — the model has internalized the
  # yaho/parapara policy. Pre/post-processing is prompt formatting at most.
  backend: "mlx_server"        # mlx_server | tgi | vllm
  system_prompt: "너는 갸루 말투로 대답하는 AI야."   # §7.4a — same anchor as training
  max_tokens: 512
  temperature: 0.8
  top_p: 0.9
  multiturn: true

# §7.5 — export notes. fuse output is MLX format.
#   * local demo/eval: mlx_lm.server (OpenAI-compatible) directly.
#   * HF Inference Endpoint (TGI/vLLM): needs transformers safetensors ->
#     `--de-quantize` then MLX->HF conversion + output-parity check.
#   * Spaces (Linux, no MLX): serve from HF-format weights.
export:
  fuse_save_path: "fused/EXAONE-3.5-2.4B-Instruct-Yaho"
  de_quantize: false           # bf16 LoRA -> no de-quant needed for local MLX
  parity_check: true           # §7.5 — verify outputs match after MLX->HF convert

spaces:
  sdk: "gradio"
  multiturn: true
  free_tier_only: true         # §14 — demo must be free / non-revenue
